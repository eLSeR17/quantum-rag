name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight test deps
        run: |
          python -m pip install --upgrade pip
          # Unit tests are CI-safe: they exercise chunker, BM25, grounding,
          # fetcher XML parsing, and evals logic. ChromaDB/sentence-transformers
          # are NOT imported at module level — only at function call time.
          pip install pytest numpy ruff

      - name: Run deterministic unit tests
        run: |
          pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check src tests scripts

  security:
    runs-on: ubuntu-latest
    steps:
      # gitleaks scans commit ranges (--log-opts --first-parent A^..B), which
      # requires full history. Shallow checkout (default fetch-depth: 1) fails
      # the scan on multi-commit pushes even with zero leaks.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          # Audit the pinned dependency set. Chromium's PYSEC-2026-3813/3814/3815
          # are documented as not_used (in-process PersistentClient only; no
          # exposed chroma server endpoints). See SECURITY.md for rationale.
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
