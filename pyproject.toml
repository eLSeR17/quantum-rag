[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-rag"
version = "0.1.0"
description = "RAG over quantum error correction & QML papers (arXiv) — evidence-first research assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "chromadb>=0.4.22,<1.0",
    "sentence-transformers>=5.5,<6.0",
    "transformers>=5.10,<6.0",
    "streamlit>=1.41,<2.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pip-audit>=2.7",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
